# .github/workflows/build.yml — CP 0.6.
#
# "GitHub Actions: Windows (MSVC) + Linux (GCC), running ctest. Both jobs green;
#  the Windows artifact downloads and runs."
#
# Design decision 6 is explicit about why Windows is a native job rather than a
# cross-compile: "Cross-compiling and *running* are different claims. A Windows
# runner proves the second." The evaluators will run a binary, so CI must too.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Saves CI minutes
# without ever cancelling a run on main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # AddressSanitizer + UndefinedBehaviorSanitizer over the whole suite.
  #
  # Its own job rather than a matrix entry because it needs different flags and
  # runs about twice as slow, and because a sanitizer finding deserves to be
  # identifiable at a glance rather than buried in one cell of a matrix.
  #
  # It found a real heap-buffer-overflow the first time it was run — a read one
  # element off each end of a row in the median filter's fast path, on
  # 1-pixel-wide images. Every other job on every platform was green.
  sanitizers:
    name: address + undefined behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libopencv-dev
      - name: Build with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON -DSAT_WITH_GUI=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the Windows job because Linux failed, or vice versa. A
      # platform-specific failure is exactly what this matrix exists to find,
      # and cancelling the other half hides whether it is platform-specific.
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-latest
            build_type: Release
            cc: gcc-13
            cxx: g++-13
          - name: linux-gcc-debug
            os: ubuntu-latest
            build_type: Debug
            cc: gcc-13
            cxx: g++-13
          - name: linux-clang-release
            os: ubuntu-latest
            build_type: Release
            cc: clang
            cxx: clang++
          # INV-7 generalised to optional dependencies: a machine without GLFW
          # must still build and still pass the whole suite. The dashboard is
          # graded, but nothing else may depend on it.
          - name: linux-no-gui
            os: ubuntu-latest
            build_type: Release
            cc: gcc-13
            cxx: g++-13
            extra_cmake: -DSAT_WITH_GUI=OFF
          # The ML path. SAT_WITH_ONNX defaults to OFF, so until this arm
          # existed nothing in CI had ever COMPILED the code inside
          # `#ifdef SAT_HAVE_ONNX` — the MotionNet wrapper's whole inference
          # body, and the parity test that exercises it. A configuration that
          # is never built is a configuration that is broken on the day
          # somebody needs it for a demo.
          - name: linux-onnx
            os: ubuntu-latest
            build_type: Release
            cc: gcc-13
            cxx: g++-13
            onnx: true
            extra_cmake: -DSAT_WITH_ONNX=ON -DONNXRUNTIME_ROOT=${{ github.workspace }}/.ort
          - name: windows-msvc-release
            os: windows-latest
            build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps SAT_GIT_HASH from `git rev-parse`, and a shallow
          # clone with no history would leave it as "unknown" in every
          # centroid.csv header produced by this build.
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Eigen and OpenCV from apt rather than vcpkg: cmake/dependencies.cmake
          # finds either, and apt takes seconds where a vcpkg source build of
          # OpenCV takes the better part of an hour. The pinned-baseline vcpkg
          # build is what the release workflow uses.
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libopencv-dev \
            libglfw3-dev libgl1-mesa-dev

      # The official release tarball, not apt or vcpkg: there is no Debian
      # package, and a vcpkg source build of ONNX Runtime takes hours. The
      # version is pinned to ml/requirements.txt's onnxruntime so the C++
      # runtime and the Python exporter are the same release — SAT-ML §4.5
      # makes that pin part of the reproducibility statement.
      - name: Install ONNX Runtime
        if: matrix.onnx
        run: |
          ORT_VERSION=1.17.1
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          mkdir -p .ort
          tar xzf ort.tgz --strip-components=1 -C .ort
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/.ort/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # The Windows runner ships a vcpkg at VCPKG_INSTALLATION_ROOT with a
          # warm binary cache, which is the fast path on this platform.
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Set compiler
        if: runner.os == 'Linux'
        run: |
          echo "CC=${{ matrix.cc }}"   >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            ${{ matrix.extra_cmake }} 2>&1 | tee configure.log

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4

      # The acceptance criterion for CP 0.6 is not "it compiled", it is "the
      # artifact downloads and runs". Proving the binary starts on the runner
      # that built it is the weaker half of that, but it catches a missing DLL
      # or a bad runtime dependency before anyone downloads anything.
      # An ONNX arm that silently configured without the runtime would pass
      # every test in this file by taking the INV-7 fallback, and would prove
      # nothing. This fails the job instead.
      - name: 'ML: assert the ONNX path was actually compiled in'
        if: matrix.onnx
        run: |
          if ! grep -q 'ONNX Runtime  : TRUE' configure.log; then
            echo "SAT_WITH_ONNX=ON but ONNX Runtime was not found — the"
            echo "inference body was not compiled and this arm proves nothing."
            exit 1
          fi

      - name: Run the binary
        run: ./build/sat-tracker --version
        shell: bash

      # CP 0.7 ★ GATE. Design §14: "If this fails, STOP and solve it — 30% of
      # marks depend on it." Benchmark Performance-2 is entirely
      # evaluator-supplied MP4s, so a platform where cv::VideoCapture cannot
      # open H.264 is a platform where nothing downstream matters.
      #
      # The gate is ENFORCED wherever the build has video support, and reported
      # as an explicit gap where it does not. It is not silently skipped: a gate
      # that quietly does nothing is worse than no gate, because it reads as a
      # green tick.
      #
      # Right now that gap is Windows: the runner has no OpenCV and installing
      # it from source through vcpkg takes longer than the rest of CI combined.
      # windows-video.yml covers it properly, on a schedule and on demand.
      - name: 'CP 0.7 GATE: OpenCV decodes a committed MP4'
        shell: bash
        run: |
          set -euo pipefail
          if ./build/sat-tracker --has-video; then
            ./build/sat-tracker --probe-video tests/video/clips/gate_320x240_30fps.mp4
            echo "CP 0.7 gate PASSED on ${{ matrix.name }}"
          else
            echo "::warning title=CP 0.7 gate not exercised::${{ matrix.name }} has no \
            OpenCV, so MP4 decode (30% of marks, design §8) is UNTESTED on this \
            platform. windows-video.yml covers it separately."
          fi

      # ---------------------------------------------------------------
      # BENCHMARK PERFORMANCE-2, called out by name — P0-4.
      #
      # 30 % of the marks. The assertions live in the `video` and `bp2_budget`
      # CTest entries, which the step above already ran; this one re-runs just
      # those and prints the numbers, so the graded figures are visible in the
      # CI log rather than buried in a 21-test summary.
      #
      # Skipped with a loud annotation where the build has no video support,
      # for the same reason as the CP 0.7 gate: a step that quietly does
      # nothing reads as a green tick.
      # ---------------------------------------------------------------
      - name: 'BP-2: end-to-end centroiding against committed truth'
        shell: bash
        run: |
          set -euo pipefail
          if ./build/sat-tracker --has-video; then
            ctest --test-dir build --build-config ${{ matrix.build_type }}                   -R '^(video|bp2_budget)$' --output-on-failure
          else
            echo "::warning title=BP-2 not exercised::${{ matrix.name }} has no             OpenCV, so Benchmark Performance-2 (30% of marks) is UNMEASURED on             this platform. windows-video.yml covers it separately."
          fi

      - name: Upload artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: sat-tracker-${{ matrix.name }}
          path: |
            build/sat-tracker
            build/sat-tracker.exe
            build/*.dll
            scenarios/
          if-no-files-found: warn
          retention-days: 14
