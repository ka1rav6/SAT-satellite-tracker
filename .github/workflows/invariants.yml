# .github/workflows/invariants.yml
#
# Design §2: "These are enforced by the build system and CI, not by convention."
# §5.1 asks specifically for a CI check that greps the tracker-side modules for
# `#include "world/` and fails if found.
#
# Every check here has a `just` recipe of the same name, so a red job can be
# reproduced locally with one command instead of by pushing again.

name: invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-gates:
    name: static invariant gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One checker for all three source invariants. It strips comments and
      # string literals before searching, and self-tests that stripping first —
      # a plain grep matched this project's own diagnostic strings and failed
      # inside the code that exists to detect violations.
      - name: 'INV-1 and INV-3: static source checks'
        run: ./tools/check_source_invariants.py

      # Documentation is a deliverable here, not a courtesy, and this gate was
      # being run by hand. It checks two different kinds of rot:
      #
      #   structure  every `just <recipe>`, repository path, relative link and
      #              cross-reference in the documented set resolves. This is
      #              what caught the Technical Report claiming `just dist` for
      #              a recipe named `just package`.
      #
      #   numbers    every figure a document ANCHORS still matches
      #              docs/baseline/run.json (P3-4). A dead link is obvious the
      #              moment somebody clicks it; a stale measurement is not, and
      #              the report's graded table was quoting 394 FPS for a run
      #              that measures 306.
      #
      # It needs no build and no dependencies: it reads the repository and a
      # committed JSON file, so it costs seconds.
      - name: 'Documentation: links, recipes and anchored numbers'
        run: ./tools/check_docs.py

      # SAT-ML ML-8 makes a model card a deliverable, and a card's numbers are
      # the claim the whole ML section rests on. They are transcribed by hand
      # from an evaluation run, and one had already drifted: the MotionNet v1
      # card quoted a 45.7% / 53.9% improvement from a training run that is not
      # the one models/motionnet_v1.eval.json records (43.4% / 49.5%). The gate
      # passes either way, which is what makes this dangerous — nothing looks
      # wrong until an evaluator checks, and then every other number is in
      # doubt too. Same class of gate as the numbers half of check_docs.
      - name: 'Model cards: gate figures match their eval artifact'
        run: ./tools/check_model_cards.py

  link-boundary:
    name: INV-1 link boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libeigen3-dev

      # Configuring is the check. cmake/modules.cmake walks each tracker-side
      # target's transitive link closure and fails configure if sat_world or
      # sat_camera is reachable. That is stronger than a grep: it catches an
      # edge added through an intermediate target, and it catches the moment the
      # edge is ADDED rather than the moment someone calls a world symbol
      # through it.
      - name: Configure (runs the INV-1 link assertion)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      # A guard that has never been seen to fail is not evidence of anything.
      # This injects a real violation, confirms configure refuses, and restores.
      # Same pattern design §2 CP 2.6 requires for the reproducibility job.
      - name: Self-test the guard by injecting a violation
        run: ./tools/verify_inv1_guard.sh
