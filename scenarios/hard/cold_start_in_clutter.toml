# hard/cold_start_in_clutter.toml — A KNOWN FAILURE, KEPT ON PURPOSE.
#
# This file was `scenarios/baseline.toml` and was the default for `--gui` and
# `--headless`, the first entry in the GUI picker, the source of the README's
# hero screenshot, the `just smoke` sanity scenario, and — per docs/DEMO.md —
# "the known-good fallback (CP 15.3)".
#
# It is not known-good. It is the worst-performing scenario in the repository,
# and it was the first thing anyone typing the obvious command would see.
#
# ---------------------------------------------------------------------------
# WHAT IT ACTUALLY SCORES
# ---------------------------------------------------------------------------
# Measured, 60 s, seed 42, on the shipped parameters below:
#
#   FOV CONTAINMENT  time on target     0.00 %   (0 / 1800 frames)
#   CENTROIDING      frames scored      0        (no frame had both a
#                                                 detection and the beacon
#                                                 in view)
#   TRACKING         RMS              913.05 px  (spec row 17 is 10 px)
#   LOCK             false tracks    1777.99 /min
#   HANDOVER         not reached
#
# Removing the clutter does not rescue it:
#
#   configuration                 frames scored   tracking RMS   time on target
#   as shipped                                0       913.05 px          0.00 %
#   clutter = 0                              76       508.36 px          -
#   clutter = 0, decoy = 0                   79       196.32 px          4.39 %
#
# In that last row the IMAGE-frame centroiding error is a healthy 0.347 px.
# The detector is fine. The beacon is simply inside the field of view for
# 79 of 1800 frames.
#
# ---------------------------------------------------------------------------
# WHY IT FAILS, AND WHY THAT IS NOT A BUG
# ---------------------------------------------------------------------------
# Spec row 11 says the target's initial location defaults to RANDOM, and spec
# row 16 asks for acquisition within 2 s. Those two requirements are mutually
# inconsistent and the design says so (§10.5): a random position on a 12.5 deg
# screen viewed through a 4x3 deg camera gives P(visible at t=0) = 7.68 %, and
# a full search at row 13's 5 deg/s takes 15-19 s. There is no controller that
# closes that gap.
#
# So the geometry is understood and the run is honestly reported — the
# compliance matrix marks cold acquisition "BOUND DERIVED" rather than FAIL.
# What was wrong was shipping this as the DEFAULT, where its failure reads as
# the system not working rather than as a specification tension.
#
# ---------------------------------------------------------------------------
# WHAT IT IS FOR NOW
# ---------------------------------------------------------------------------
# It is the hard case, and it earns its place: it is the scenario the
# acquisition work (Stage 13) and the appearance-discrimination work (the ML
# component) exist to solve, and it is the honest demonstration of the
# clutter failure. docs/DEMO.md step 6 runs it deliberately.
#
# The defaults now point at scenarios/spec_defaults.toml, which is this file
# with row 11's random position pinned inside the field of view and nothing
# else changed.

[meta]
name        = "cold_start_in_clutter"
description = "HARD CASE: spec row 11 random start in a 120-source clutter field. Known failure — see the header."

[input]
mode = "synthetic"                  # design §8.3

[sim]
truth_hz   = 300                    # 10 sub-ticks per camera frame (design §6.2)
camera_hz  = 30                     # row 5, minimum 30
control_hz = 30                     # row 15, minimum 20
duration_s = 60
seed       = 42

[world]
canvas_px      = [2000, 2000]       # row 1, minimum 2000 x 2000
edge_behaviour = "bounce"

[camera]
type           = "mono"             # row 2
resolution     = [640, 480]         # row 3
fov_deg        = [4.0, 3.0]         # row 4
exposure_ms    = 5.0
blur_substeps  = 8                  # design §9.2
initial_pos_px = [999.5, 999.5]     # row 6, the centre of the screen

[target]
kind       = "target"               # row 7, a beacon spot
intensity  = 120.0
size_px    = 10                     # row 10, permitted 5-20
initial_px = "random"               # row 11
shape.type = "square"               # row 9

[[target.motion]]                   # row 12, straight line
kind          = "linear"
velocity_px_s = [22.0, -11.0]

[gimbal]
max_pan_dps      = 5.0              # row 13, permitted 5-10
max_tilt_dps     = 5.0              # row 14, permitted 5-10
max_accel_dps2   = 50.0
time_constant_s  = 0.020
latency_s        = 0.010
encoder_lsb_urad = 20.0
resonance_hz     = 0.0

[noise]
poisson        = true               # row 21
gaussian_sigma = 20.0               # row 22, maximum 20 grey levels
salt_pepper    = 0.10               # row 21, ~10%
hot_pixels     = 40

[atmosphere]
mode = "clear"                      # row 24

[disturbance]
jitter_px_per_frame = 20.0          # row 23, maximum +/- 20

[[disturbance.platform]]            # row 25, linear is mandatory
kind          = "linear"
velocity_px_s = [15.0, -8.0]

[clutter]
static_sources = 120                # design §9.1, "mandatory for credibility"
decoy_beacons  = 1

[ai]
enabled          = true
fallback_on_fail = true             # INV-7

[logging]
centroid_csv = "logs/centroid.csv"
metrics_json = "logs/run.json"
report_html  = "logs/report.html"

[requirements]
acquisition_s     = 2.0             # row 16
tracking_error_px = 10.0            # row 17
target_loss_frac  = 0.05            # row 18
reacquisition_s   = 1.0             # row 19
min_fps           = 20.0            # row 20
