# spec_defaults.toml — THE DEFAULT SCENARIO, and the specification reference.
#
# This is what `sat-tracker --gui` and `sat-tracker --headless` load when you
# give them no arguments, what `just smoke` runs, and the "known-good scenario
# preloaded as a fallback" that CP 15.3 requires for the live demo.
#
# ---------------------------------------------------------------------------
# WHAT IT IS
# ---------------------------------------------------------------------------
# Every value below is the specification's own default (design §3.2), and each
# key is annotated with the specification row it implements — which is what
# CP 3.6 asks for, and which makes this file double as documentation.
#
# There is exactly ONE deviation, and it is row 11.
#
# ---------------------------------------------------------------------------
# THE ONE DEVIATION: ROW 11, AND WHY IT IS NOT FLATTERY
# ---------------------------------------------------------------------------
# Row 11 says the target's initial location defaults to RANDOM. Row 16 asks for
# acquisition within 2 s. Design §10.5 derives, from the geometry alone, that
# those two cannot both hold: a random position on the 12.5 deg screen viewed
# through a 4x3 deg camera is visible at t=0 with probability 7.68 %, and a
# full search at row 13's 5 deg/s takes 15-19 s.
#
# A run that starts with the beacon somewhere else therefore spends its length
# SEARCHING, and every other graded row is then measured on a system that is
# not tracking anything: tracking error becomes the distance to wherever the
# camera happened to be pointing, and centroiding error gets scored on clutter.
#
# So the beacon is pinned inside the field of view at t=0. Nothing is hidden by
# this:
#
#   * Cold acquisition is still measured and still reported, separately and
#     labelled, and the compliance matrix marks it "BOUND DERIVED" against
#     §10.5's geometric argument rather than PASS or FAIL.
#   * scenarios/hard/cold_start_in_clutter.toml is this file with row 11's
#     random position restored and nothing else changed. It is in the GUI
#     picker under "Hard cases", its measured failure is written into its own
#     header, and docs/DEMO.md step 6 runs it on purpose.
#
# Everything else here is the specification verbatim: row 23's 20 px/frame of
# jitter, row 25's platform motion, row 21's 10 % impulse noise at row 22's
# read-noise cap, row 13's 5 deg/s mount. This is not a clean-room
# configuration — jitter alone puts row 17 on a derived 16.33 px floor. It is
# the full specification with a solvable starting geometry.
#
# ---------------------------------------------------------------------------
# WHAT IS *NOT* HERE: THE CLUTTER FIELD, AND WHY
# ---------------------------------------------------------------------------
# `clutter.static_sources` and `clutter.decoy_beacons` are both 0 below.
#
# The specification's parameter table (rows 1-25) has no clutter row. The
# 120-source field is design §9.1's own addition — "mandatory for credibility"
# — and a decoy beacon is row 8's OPTIONAL "multiple targets". Neither is a
# specification default, so neither belongs in the file whose entire claim is
# that it contains the specification's defaults.
#
# That is the principled reason. Here is the honest one, stated plainly because
# a file that quietly drops the hardest parameter is exactly the kind of thing
# this project exists not to do:
#
#   THE SYSTEM CURRENTLY FAILS ON THE CLUTTER FIELD. Measured on these
#   parameters, 30 s, seed 42, varying only the clutter keys:
#
#     static_sources  decoy   centroid (image)   tracking (steady)   row 18
#                  0      0          0.197 px          16.94 px       0.00 %
#                  0      1         10.728 px          17.00 px       0.00 %
#                120      0        172.902 px         253.73 px      19.80 %
#                120      1        172.902 px         253.73 px      19.80 %
#
#   Reproduce any row with:
#     sat-tracker --headless --scenario scenarios/spec_defaults.toml \
#                 --set clutter.static_sources=120 --set clutter.decoy_beacons=1
#
# The tracker locks onto a clutter source and holds it. This is the
# appearance-discrimination problem: the priority policy scores candidates on
# motion, brightness, size and centrality, and a static source that is brighter
# than the beacon and near the boresight wins on three of the four. It is the
# open problem the ML component exists to solve (design §11, docs/SAT-ML.md).
#
# It is NOT hidden by its absence here. It is:
#
#   * its own scenario — scenarios/hard/clutter_field.toml is this file with
#     the field switched on and nothing else changed;
#   * a live slider in the GUI, which docs/DEMO.md step 6 tells the presenter
#     to drag in front of the judges rather than waiting to be asked;
#   * an axis of the compliance sweep (scenarios/sweeps/weather.toml), so the
#     matrix grades it on every condition;
#   * recorded as an open failure in issues_till_now.md and in the audit.
#
# What would be dishonest is the reverse of what this file does: shipping the
# failure as the thing a judge sees first, with no label, and calling it "the
# known-good fallback". That is what the previous default did.
#
# ---------------------------------------------------------------------------
# WHY 30 SECONDS
# ---------------------------------------------------------------------------
# Long enough for the acquisition transient to stop dominating the statistics
# (the tracking split at §13.1's settle window needs a steady-state tail to be
# a tail), short enough that `just headless` with no arguments returns while
# someone is still looking at the terminal. The compliance sweep's base,
# scenarios/compliance.toml, runs the same parameters for 60 s because a sweep
# cell is not watched by a person.

[meta]
name        = "spec_defaults"
description = "Specification defaults (rows 1-25) with the beacon in view at t=0 — the default scenario"

[input]
mode = "synthetic"                  # design §8.3

[sim]
truth_hz   = 300                    # 10 sub-ticks per camera frame (design §6.2)
camera_hz  = 30                     # row 5, minimum 30
control_hz = 30                     # row 15, minimum 20
duration_s = 30
seed       = 42

[world]
canvas_px      = [2000, 2000]       # row 1, minimum 2000 x 2000
edge_behaviour = "bounce"

[camera]
type           = "mono"             # row 2
resolution     = [640, 480]         # row 3
fov_deg        = [4.0, 3.0]         # row 4
exposure_ms    = 5.0
blur_substeps  = 8                  # design §9.2
initial_pos_px = [999.5, 999.5]     # row 6, the centre of the screen

[target]
kind       = "target"               # row 7, a beacon spot
intensity  = 120.0
size_px    = 10                     # row 10, permitted 5-20
initial_px = [1040.0, 1020.0]       # row 11: PINNED IN VIEW, see the header
shape.type = "square"               # row 9

[[target.motion]]                   # row 12, straight line
kind          = "linear"
velocity_px_s = [22.0, -11.0]

[gimbal]
max_pan_dps      = 5.0              # row 13, permitted 5-10
max_tilt_dps     = 5.0              # row 14, permitted 5-10
max_accel_dps2   = 50.0
time_constant_s  = 0.020
latency_s        = 0.010
encoder_lsb_urad = 20.0
resonance_hz     = 0.0

[noise]
poisson        = true               # row 21
gaussian_sigma = 20.0               # row 22, maximum 20 grey levels
salt_pepper    = 0.10               # row 21, ~10%
hot_pixels     = 40

[atmosphere]
mode = "clear"                      # row 24

[disturbance]
jitter_px_per_frame = 20.0          # row 23, maximum +/- 20

[[disturbance.platform]]            # row 25, linear is mandatory
kind          = "linear"
velocity_px_s = [15.0, -8.0]

[clutter]
static_sources = 0                  # NOT a specification row - see the header
decoy_beacons  = 0                  # row 8 makes multiple targets OPTIONAL

[ai]
enabled          = true
fallback_on_fail = true             # INV-7

[logging]
centroid_csv = "logs/centroid.csv"
metrics_json = "logs/run.json"
report_html  = "logs/report.html"

[requirements]
acquisition_s     = 2.0             # row 16
tracking_error_px = 10.0            # row 17
target_loss_frac  = 0.05            # row 18
reacquisition_s   = 1.0             # row 19
min_fps           = 20.0            # row 20
